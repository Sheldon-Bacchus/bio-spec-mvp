schema_version: "1.0"
contract_id: "research-capability-binding"
purpose: "Plan-level discovery and selection contract for a generic research feature."
required:
  - capability_id
  - candidate_skill_ids
  - selection_reason
  - phase
  - inputs
  - outputs
  - verifier
  - failure_policy
  - provenance
  - status
fields:
  capability_id: {type: string, description: "Feature-scoped capability need"}
  candidate_skill_ids: {type: array, items: string}
  skill_id: {type: string, nullable: true}
  preset_id: {type: string, nullable: true}
  selection_reason: {type: string}
  phase: {type: string, description: "Opaque project-defined label"}
  inputs: {type: array, items: string}
  outputs: {type: array, items: string}
  verifier: {type: string}
  failure_policy: {type: string}
  provenance: {type: array, items: string}
  status:
    type: string
    enum: [unresolved, candidate, selected, blocked]
rules:
  - "selected requires skill_id and a complete Skill/Extension contract."
  - "unresolved or blocked requires an explicit reason in selection_reason or failure_policy."
  - "The record must not select a candidate solely because it is present in the catalog."
