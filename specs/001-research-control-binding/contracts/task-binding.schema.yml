schema_version: "1.0"
contract_id: "research-task-binding"
purpose: "Task-level frozen execution handoff for Spec Kit implementation."
required:
  - task_id
  - skill_id
  - inputs
  - outputs
  - dependencies
  - verifier
  - acceptance
  - failure_behavior
  - provenance
fields:
  task_id: {type: string, pattern: "^T[0-9]{3,}$"}
  phase: {type: string, description: "Optional opaque project-defined label"}
  skill_id: {type: string}
  preset_id: {type: string, nullable: true}
  inputs: {type: array, items: string}
  outputs: {type: array, items: string}
  dependencies: {type: array, items: string}
  verifier: {type: string}
  acceptance: {type: string}
  failure_behavior: {type: string}
  provenance: {type: array, items: string}
rules:
  - "An executable task must name a concrete skill_id; blocked tasks must say why."
  - "The binding must trace to a selected capability in plan.md."
  - "Failure must stop or block the task and preserve the failing evidence."
