schema_version: "1.0"

preset:
  id: "research-control"
  name: "Research Control Spec Kit Preset"
  version: "0.2.0"
  description: "Reusable evidence-aware Spec Kit artifact templates with plan-time capability selection and task-time binding."
  author: "Sheldon-Bacchus"
  repository: "https://github.com/Sheldon-Bacchus/bio-spec-kit"
  license: "MIT"

requires:
  speckit_version: ">=0.14.0"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Spec Kit feature specification with scientific question and evidence boundaries"
      replaces: "spec-template"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Spec Kit implementation plan with research design and provenance gates"
      replaces: "plan-template"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Spec Kit tasks with validation commands and evidence paths"
      replaces: "tasks-template"

tags:
  - "research"
  - "spec-kit"
  - "control-plane"
  - "evidence"
