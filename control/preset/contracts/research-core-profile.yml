schema_version: "0.2"
contract_id: "research-control-profile"
status: "generic-reusable"
source_feature: "research-control"
core:
  owns:
    - "canonical Spec Kit feature artifact structure"
    - "research question, estimand, evidence, provenance, and claim-boundary fields"
    - "plan-level capability discovery and selection record"
    - "task-level frozen execution binding and verifier fields"
    - "explicit fail-closed and blocked-state vocabulary"
  does_not_own:
    - "domain-specific semantics, methods, thresholds, or reference data"
    - "tool/process implementation or pipeline-engine execution"
    - "scientific claims, result interpretation, or human release approval"
    - "a fixed list or sequence of domain Skills"
skill_binding:
  selected_at: "plan"
  frozen_at: "tasks"
  required_fields:
    - "capability_id"
    - "skill_id"
    - "preset_id"
    - "inputs"
    - "outputs"
    - "verifier"
    - "failure_behavior"
  unresolved_state: "unresolved or blocked with an explicit reason"
verification:
  required_sources:
    - "feature spec.md"
    - "selected Skill or Extension contract"
    - "recorded source/version and input/output manifest"
