schema_version: "1.0"

workflow:
  id: "research-control"
  name: "Research Control Workflow"
  version: "0.2.0"
  author: "Sheldon-Bacchus"
  description: "Run the generic Spec Kit feature lifecycle; domain execution is selected explicitly by plan/task bindings."

requires:
  speckit_version: ">=0.14.0"
  integrations:
    any: ["claude", "codex", "copilot", "generic"]

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe the research feature or analysis decision"
  integration:
    type: string
    default: "auto"
    prompt: "Spec Kit integration (auto uses the initialized project integration)"

steps:
  - id: "specify"
    command: "speckit.specify"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: "plan"
    command: "speckit.plan"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: "tasks"
    command: "speckit.tasks"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: "implement"
    command: "speckit.implement"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: "converge"
    command: "speckit.converge"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"
